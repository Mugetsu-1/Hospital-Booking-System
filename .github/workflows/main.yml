name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Ephemeral PostgreSQL for the schema/seed/e2e steps, matching the local
    # development setup.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hospital_booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hospital_booking?schema=public
      JWT_SECRET: ci_test_secret_value

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Apply Database Schema
        working-directory: backend
        run: npm run db:setup

      - name: Seed Demo Data
        working-directory: backend
        run: npm run seed

      - name: Run Syntax & Lint Checks
        run: npm run lint --if-present

      - name: Run Unit Test Suite (offline)
        working-directory: backend
        run: npm test

      # The API is started, exercised and shut down inside a single step:
      # a process backgrounded in one step is not guaranteed to survive into
      # the next one on the Actions runner.
      - name: Run End-to-End API Suite
        working-directory: backend
        run: |
          npm start > api.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:5000/api/health > /dev/null; then break; fi
            if ! kill -0 $server_pid 2>/dev/null; then
              echo 'API exited before becoming healthy'
              cat api.log
              exit 1
            fi
            sleep 1
          done

          if ! curl -fs http://127.0.0.1:5000/api/health > /dev/null; then
            echo 'API did not become healthy within 30s'
            cat api.log
            exit 1
          fi

          npm run test:e2e

      - name: Build Production Bundle
        working-directory: frontend
        run: npm run build
